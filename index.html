<!doctype html>
<html lang="en-IE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="pfc-release" content="%VITE_SENTRY_RELEASE%" />
    <!-- theme-color equals the manifest's theme_color; src/pwa/icons.test.ts holds them together.
         The three apple-* tags are the whole of iOS install support (D44): Safari reads no manifest
         icon. Vite prefixes the href with the base at build time. -->
    <meta name="theme-color" content="#4d4d4d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Phibsboro" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>Phibsboro FC</title>
  </head>
  <body>
    <!-- The boot splash (S2.6, AC9): the crest centred on the theme background, shown before a
         line of JS runs so a returning player sees the crest, never a flash of the login screen.
         React's first paint replaces #root's children with the identical <AppSplash />, so the
         handover produces no visible change. The background reads --background from the token layer
         (the linked stylesheet is in <head>), with a white fallback for the instant before it
         applies; --background is white, so the two agree. No hardcoded hex lives in a component. -->
    <div id="root">
      <div
        style="
          position: fixed;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          background: var(--background, #fff);
        "
      >
        <img
          src="/icons/icon-192.png"
          alt="Phibsboro FC"
          width="88"
          height="88"
          style="width: 88px; height: 88px"
        />
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
