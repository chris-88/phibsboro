name: CI

# Every pull request and every push to main. One step reads secrets — the S1.4 RLS suite, which
# runs against the hosted project (D63) — and that step alone is skipped on a pull request from a
# fork, where GitHub withholds them. Everything else runs on a fork, and the privileged fork
# trigger is never needed (D14, D38).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: UTC # D53 — a Dublin date assertion must not depend on the runner's clock
  # ci-env-parity:start — every VITE_ key in .env.example. The build that the pwa job drives
  # in a browser must carry them: src/lib/env.ts throws at boot on a missing anon key, and a
  # thrown boot never registers the service worker, so every pwa test then times out. That is
  # how the first post-S1.5 run failed. Fallbacks keep a fork pull request (no vars) building.
  VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'http://127.0.0.1:54321' }}
  VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_ci-placeholder-not-a-real-key' }}
  VITE_APP_BASE_URL: ${{ vars.VITE_APP_BASE_URL || 'http://127.0.0.1:4173' }}
  VITE_BASE_PATH: '/'
  VITE_SENTRY_DSN: ''
  VITE_SENTRY_RELEASE: ${{ github.sha }}
  VITE_SENTRY_ENVIRONMENT: ci
  # ci-env-parity:end
  SUPABASE_CLI_VERSION: '2.108.0' # exact, never `latest`; matches the dev machine — S2.6 needs [auth.sessions]

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      # scripts/check-env-parity.mjs is S0.5's file (its AC14). Until S0.5 ships it there is
      # nothing to compare .env.example against, so the step reports and passes rather than
      # failing every build in between. Once the file exists this step fails when it fails.
      - name: Env parity
        run: |
          if [ -f scripts/check-env-parity.mjs ]; then
            node scripts/check-env-parity.mjs
          else
            echo 'scripts/check-env-parity.mjs not present yet — added by S0.5 (deployment).'
          fi

  # S0.4 — the service-worker and installability gate. Builds, then runs the Playwright `pwa`
  # project against `vite preview`: the two-build staleness test (AC5), the offline shell (AC6),
  # the controlled cold deep link (AC8), and Chromium's own installability verdict (AC4). No
  # stack, no secret, so it runs on a fork pull request (D14). D43 named an `e2e` job; there is
  # none until S7.3, so this is its own job.
  pwa:
    name: pwa
    runs-on: ubuntu-latest
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The full Chromium build, not only the headless shell: the AC4 installability verdict
      # comes from the browser layer the shell does not have.
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test --project=pwa
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-pwa
          path: playwright-report
          retention-days: 7

  # S1.1, S1.2 — the database gate. Brings up the CLI's local stack, resets it from the migration
  # files, seeds it, and runs tests/db against it. No secret: the local anon and service-role keys
  # are published constants (D14, D38). S1.4 appends the RLS suite, which does read secrets.
  db:
    name: db
    runs-on: ubuntu-latest
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # AC20 diffs against origin/main
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - run: npm ci
      - run: supabase start
      - name: Local stack key names (values never printed)
        run: supabase status -o env | cut -d= -f1 | sort | tr '\n' ' '; echo
      # S1.1 AC1 — clean from empty, twice in a row. The second reset is S1.2's `db:reset`, which
      # applies the migrations and then runs the seed (S1.2 AC15, AC28).
      - run: supabase db reset
      # The workflow-level VITE_SUPABASE_URL is the hosted project, for the pwa build. The seed
      # reads SUPABASE_URL first and refuses any non-local host, so pin these two steps to the
      # stack `supabase start` just brought up. That refusal is what kept the first run of this
      # job off production.
      - run: npm run db:reset
        env:
          SUPABASE_URL: http://127.0.0.1:54321
      # tests/db: schema (S1.1), profile trigger and seed (S1.2). seed.test.ts reseeds itself.
      - run: npm run test:db
        env:
          SUPABASE_URL: http://127.0.0.1:54321
      # S1.4 — the RLS suite, as every role with real JWTs, against the hosted project: there is
      # one project and no real data until go-live, so the suite wipes and reseeds it (D63; the
      # go-live checklist in docs/database.md retires this). Needs the repository secrets, so it
      # is skipped on a pull request from a fork. tests/helpers/target.ts refuses any URL that is
      # not SUPABASE_PROJECT_REF's.
      - name: RLS suite (hosted project)
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run test:rls
      - name: Enums generate as unions # AC17
        run: |
          supabase gen types typescript --local --schema public > /tmp/types.ts
          grep -qF 'event_type: "training" | "match"' /tmp/types.ts
      # S1.5 AC1 — the committed src/lib/database.types.ts is what the migrations produce. Same
      # generator, same Prettier pass as `npm run db:types`. The one line excluded is the
      # PostgREST version stamp, which names the hosted project's version (db:types runs
      # --linked) and differs from the local stack's; it types nothing.
      - name: Generated types are current # S1.5 AC1
        run: |
          npx prettier --stdin-filepath src/lib/database.types.ts < /tmp/types.ts > /tmp/types.formatted.ts
          diff <(grep -v PostgrestVersion /tmp/types.formatted.ts) <(grep -v PostgrestVersion src/lib/database.types.ts)
      - name: Migrations are the whole schema # AC18
        run: |
          test -z "$(supabase db diff --schema public --local)"
      - name: Merged migrations are immutable # AC20
        run: |
          test -z "$(git diff --diff-filter=MD --name-only origin/main...HEAD -- supabase/migrations)"
      - if: always()
        run: supabase stop --no-backup

  pr-title:
    name: pr-title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v5
      - name: Conventional commit title
        env:
          # Quoted through the environment, never interpolated into the shell line: a pull
          # request title is attacker-controlled text.
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$TITLE" | grep -Eq '^(feat|fix|chore|docs|refactor|test|build|ci|perf|revert)(\([a-z0-9.-]+\))?!?: .+' \
            || { echo "PR title must be a conventional commit, e.g. 'feat(events): create event form'. Allowed types: feat, fix, chore, docs, refactor, test, build, ci, perf, revert."; exit 1; }
