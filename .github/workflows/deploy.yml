name: deploy

# The only path that publishes (AC1). Tests are not re-run here: main is protected and S0.7's
# `check` job has already gone green on the pull request (D14).
on:
  push:
    branches: [main]
  workflow_dispatch: # AC12 — re-deploy current main without an empty commit

permissions:
  contents: read
  pages: write
  id-token: write

# AC11 — two merges a minute apart must not interleave. Never cancel in progress: a half-published
# Pages deployment is worse than a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  TZ: UTC

jobs:
  # AC3 — migrations are applied before, and gate, the publish. A failure here leaves the previous
  # bundle live (AC15).
  #
  # DEVIATION: Supabase is not yet provisioned for CI, so this job is a no-op until the secrets
  # exist. Once SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF are set it applies migrations for
  # real. See docs/deployment.md.
  migrate:
    name: migrate
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_CLI_VERSION: '2.108.0'
    steps:
      - uses: actions/checkout@v5

      - name: Skip when Supabase is not configured
        id: guard
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ] || [ -z "${SUPABASE_PROJECT_REF}" ]; then
            echo 'Supabase secrets absent — no migrations applied. Set SUPABASE_ACCESS_TOKEN and'
            echo 'SUPABASE_PROJECT_REF to enable this job (docs/deployment.md).'
            echo 'configured=false' >> "$GITHUB_OUTPUT"
          elif [ ! -d supabase/migrations ]; then
            echo 'No supabase/migrations directory yet — S1.1 creates it.'
            echo 'configured=false' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.guard.outputs.configured == 'true'
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Apply migrations
        if: steps.guard.outputs.configured == 'true'
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push

  build:
    name: build
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Build
        env:
          # env-parity:start — scripts/check-env-parity.mjs compares this block against .env.example (AC14)
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_BASE_URL: ${{ vars.VITE_APP_BASE_URL }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: ${{ vars.VITE_SENTRY_ENVIRONMENT }}
          # env-parity:end
          # AC2 — the release is the commit SHA, substituted into the pfc-release meta tag.
          VITE_SENTRY_RELEASE: ${{ github.sha }}
        run: npm run build

      # AC6, AC7, AC9. Secrets are passed in so the script can prove they are absent from dist/.
      - name: Verify the artifact
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: ./scripts/verify-dist.sh dist

      - name: Assert the release meta tag carries this commit
        run: |
          grep -q "content=\"${{ github.sha }}\"" dist/index.html \
            || { echo 'pfc-release meta does not carry the commit SHA (AC2)'; exit 1; }

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # AC10 — read-only check against the live origin. Signs in to nothing, writes nothing.
  smoke:
    name: smoke
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Smoke the deployed site
        env:
          SMOKE_BASE_URL: ${{ needs.deploy.outputs.page_url || vars.VITE_APP_BASE_URL }}
          EXPECTED_RELEASE: ${{ github.sha }}
        run: npx playwright test --project=smoke-deployed
